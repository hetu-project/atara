<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-label="A bank receipt sits in the narrow band of conditions a machine can read. Insurance claims, ad conversion, outsourced delivery and service acceptance all fall in the much wider band where somebody has to rule.">
  <style>
    .lbl{fill:#6b7180;font:400 15px/1 Inter,system-ui,sans-serif}
    .lbl-on{fill:#2518eb;font:500 15px/1 Inter,system-ui,sans-serif}
    .zone{font:500 12px/1 Inter,system-ui,sans-serif;letter-spacing:.14em}
    .lead{stroke:#c8ccd5;stroke-width:1}
    .pin{fill:#b4b9c4}.pin-on{fill:#2518eb}
  </style>

  <rect width="960" height="260" fill="#ffffff"/>

  <!-- Where each condition falls. The split does the arguing: a hard
       edge says most of them are on one side, which a gradient cannot. -->
  <g>
    <path class="lead" d="M108 84V140"/>
    <circle class="pin-on" cx="108" cy="84" r="3.5"/>
    <text class="lbl-on" x="108" y="68" text-anchor="middle">Bank receipt</text>

    <path class="lead" d="M352 118V140"/>
    <circle class="pin" cx="352" cy="118" r="3.5"/>
    <text class="lbl" x="352" y="102" text-anchor="middle">Insurance claims</text>

    <path class="lead" d="M492 84V140"/>
    <circle class="pin" cx="492" cy="84" r="3.5"/>
    <text class="lbl" x="492" y="68" text-anchor="middle">Ad conversion</text>

    <path class="lead" d="M652 118V140"/>
    <circle class="pin" cx="652" cy="118" r="3.5"/>
    <text class="lbl" x="652" y="102" text-anchor="middle">Outsourced delivery</text>

    <path class="lead" d="M824 84V140"/>
    <circle class="pin" cx="824" cy="84" r="3.5"/>
    <text class="lbl" x="824" y="68" text-anchor="middle">Service acceptance</text>
  </g>

  <!-- the narrow band a machine can settle, and the wide one it cannot -->
  <path d="M40 140h136v72H44a4 4 0 0 1-4-4Z" fill="#2518eb"/>
  <path d="M180 140h736a4 4 0 0 1 4 4v64a4 4 0 0 1-4 4H180Z" fill="#e8eaf0"/>

  <text class="zone" x="204" y="182" fill="#6b7180">SOMEBODY HAS TO RULE</text>
  <text class="zone" x="900" y="182" fill="#a2a7b4" text-anchor="end">MOST PAYMENT CONDITIONS</text>
  <text class="zone" x="40" y="240" fill="#2518eb">A MACHINE CAN READ IT</text>
</svg>
