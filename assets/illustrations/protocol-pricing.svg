<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="An AI model reads a counterparty's record of 142 settlements and 3 defaults through a weighted network and computes a probability of default of 1.8 percent for this trade">
  <style>
    .cap{fill:#9aa0ad;font:500 12px/1 Inter,system-ui,sans-serif;letter-spacing:.14em}
    .lbl{fill:#6b7180;font:400 15px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
    .out{fill:#14161f;font:300 66px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
    .for{fill:#16724d;font:500 14px/1 Inter,system-ui,sans-serif;letter-spacing:.02em}
    .rule{stroke:#e7e8ee;stroke-width:1}
    .dot{fill:#ccd1de}.miss{fill:#e58272}
    .e{stroke:#e2e4eb;stroke-width:1;fill:none}
    .ew{stroke:#16724d;fill:none}
    .n{fill:#fff;stroke:#b9bfcf;stroke-width:1.3}
    .l1{animation:fire 4.6s ease-in-out -3.4s infinite}
    .l2{animation:fire 4.6s ease-in-out -3s infinite}
    .l3{animation:fire 4.6s ease-in-out -2.5s infinite}
    @keyframes fire{0%,6%{opacity:.3}20%,100%{opacity:1}}
    .flow{stroke:#16724d;stroke-width:1.5;fill:none;stroke-linecap:round;
      stroke-dasharray:60;animation:flow 4.6s ease-in-out -3.1s infinite}
    @keyframes flow{0%,6%{stroke-dashoffset:60}26%,100%{stroke-dashoffset:0}}
    .flow-2{animation-delay:-2.2s}
    @media(prefers-reduced-motion:reduce){
      .l1,.l2,.l3{animation:none;opacity:1}
      .flow{animation:none;stroke-dashoffset:0}
    }
  </style>

  <rect width="900" height="400" fill="#ffffff"/>

  <!-- the record: what this counterparty has actually done -->
  <text class="cap" x="60" y="118">THIS COUNTERPARTY</text>
  <g class="dot">
    <circle cx="66" cy="160" r="5"/><circle cx="92" cy="160" r="5"/><circle cx="118" cy="160" r="5"/><circle cx="144" cy="160" r="5"/><circle cx="170" cy="160" r="5"/>
    <circle cx="66" cy="186" r="5"/><circle cx="92" cy="186" r="5"/><circle cx="144" cy="186" r="5"/><circle cx="170" cy="186" r="5"/>
    <circle cx="66" cy="212" r="5"/><circle cx="92" cy="212" r="5"/><circle cx="118" cy="212" r="5"/><circle cx="144" cy="212" r="5"/><circle cx="170" cy="212" r="5"/>
    <circle cx="66" cy="238" r="5"/><circle cx="118" cy="238" r="5"/><circle cx="144" cy="238" r="5"/><circle cx="170" cy="238" r="5"/>
  </g>
  <g class="miss">
    <circle cx="118" cy="186" r="5"/><circle cx="92" cy="238" r="5"/>
  </g>
  <path class="rule" d="M60 268h130"/>
  <text class="lbl" x="60" y="294">142 settlements</text>
  <text class="lbl" x="60" y="318">3 defaults</text>

  <!-- the model reading it: hairline network, weight where it matters -->
  <text class="cap" x="330" y="118">AI MODEL</text>
  <g class="e">
    <g class="l1">
      <path d="M346 160L400 176M346 160L400 224M346 200L400 176M346 200L400 224M346 240L400 224M346 240L400 272M346 280L400 224M346 280L400 272"/>
    </g>
    <g class="l2">
      <path d="M400 176L470 220M400 224L470 220M400 272L470 220"/>
    </g>
  </g>
  <g class="ew" stroke-width="1.8">
    <path class="l1" d="M346 200L400 176M346 240L400 224"/>
    <path class="l2" d="M400 176L470 220M400 224L470 220"/>
  </g>
  <g class="n">
    <circle class="l1" cx="346" cy="160" r="5.5"/><circle class="l1" cx="346" cy="200" r="5.5"/><circle class="l1" cx="346" cy="240" r="5.5"/><circle class="l1" cx="346" cy="280" r="5.5"/>
    <circle class="l2" cx="400" cy="176" r="5.5"/><circle class="l2" cx="400" cy="224" r="5.5"/><circle class="l2" cx="400" cy="272" r="5.5"/>
  </g>
  <circle class="l3" cx="470" cy="220" r="9" fill="#16724d"/>

  <!-- the record goes in, the estimate comes out -->
  <path class="flow" d="M210 220H326"/>
  <path class="flow flow-2" d="M492 220H590"/>

  <!-- the number it lands on -->
  <text class="cap" x="618" y="164">PROBABILITY OF DEFAULT</text>
  <text class="out" x="618" y="234">1.8%</text>
  <text class="for" x="618" y="268">for this trade</text>
  <path d="M618 282h62" stroke="#cde94e" stroke-width="3"/>
</svg>
