<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="An AI model reads a counterparty's record of 142 settlements and 3 defaults through a weighted network and computes a probability of default of 1.8 percent for this trade">
  <style>
    .cap{fill:#9aa0ad;font:500 12px/1 Inter,system-ui,sans-serif;letter-spacing:.14em}
    .lbl{fill:#6b7180;font:400 15px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
    .out{fill:#14161f;font:300 68px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
    .for{fill:#2518eb;font:500 14px/1 Inter,system-ui,sans-serif;letter-spacing:.02em}
    .rule{stroke:#e7e8ee;stroke-width:1}
    .dot{fill:#ccd1de}.miss{fill:#e58272}
    .e{stroke:#e2e4eb;stroke-width:1;fill:none}
    .ew{stroke:#2518eb;fill:none}
    .n{fill:#fff;stroke:#b9bfcf;stroke-width:1.3}
    .l1{animation:fire 4.6s ease-in-out -3.4s infinite}
    .l2{animation:fire 4.6s ease-in-out -3s infinite}
    .l3{animation:fire 4.6s ease-in-out -2.5s infinite}
    @keyframes fire{0%,6%{opacity:.3}20%,100%{opacity:1}}
    .flow{stroke:#2518eb;stroke-width:1.5;fill:none;stroke-linecap:round;
      stroke-dasharray:52;animation:flow 4.6s ease-in-out -3.1s infinite}
    @keyframes flow{0%,6%{stroke-dashoffset:52}26%,100%{stroke-dashoffset:0}}
    .flow-2{animation-delay:-2.2s}
    @media(prefers-reduced-motion:reduce){
      .l1,.l2,.l3{animation:none;opacity:1}
      .flow{animation:none;stroke-dashoffset:0}
    }
  </style>

  <rect width="800" height="600" fill="#ffffff"/>

  <!-- the record: what this counterparty has actually done -->
  <text class="cap" x="76" y="212">THIS COUNTERPARTY</text>
  <g class="dot">
    <circle cx="82" cy="256" r="5"/><circle cx="108" cy="256" r="5"/><circle cx="134" cy="256" r="5"/><circle cx="160" cy="256" r="5"/><circle cx="186" cy="256" r="5"/>
    <circle cx="82" cy="282" r="5"/><circle cx="108" cy="282" r="5"/><circle cx="160" cy="282" r="5"/><circle cx="186" cy="282" r="5"/>
    <circle cx="82" cy="308" r="5"/><circle cx="108" cy="308" r="5"/><circle cx="134" cy="308" r="5"/><circle cx="160" cy="308" r="5"/><circle cx="186" cy="308" r="5"/>
    <circle cx="82" cy="334" r="5"/><circle cx="134" cy="334" r="5"/><circle cx="160" cy="334" r="5"/><circle cx="186" cy="334" r="5"/>
  </g>
  <g class="miss">
    <circle cx="134" cy="282" r="5"/><circle cx="108" cy="334" r="5"/>
  </g>
  <path class="rule" d="M76 366h130"/>
  <text class="lbl" x="76" y="394">142 settlements</text>
  <text class="lbl" x="76" y="418">3 defaults</text>

  <!-- the model reading it: hairline network, weight where it matters -->
  <text class="cap" x="300" y="212">AI MODEL</text>
  <g class="e">
    <g class="l1">
      <path d="M316 244 356 272M316 244 356 300M316 300 356 272M316 300 356 328M316 356 356 300M316 356 356 328M316 412 356 328M316 412 356 356"/>
    </g>
    <g class="l2">
      <path d="M356 272 440 300M356 300 440 300M356 328 440 300M356 356 440 300"/>
    </g>
  </g>
  <g class="ew" stroke-width="1.8">
    <path class="l1" d="M316 300 356 300M316 356 356 328"/>
    <path class="l2" d="M356 300 440 300M356 328 440 300"/>
  </g>
  <g class="n">
    <circle class="l1" cx="316" cy="244" r="5.5"/><circle class="l1" cx="316" cy="300" r="5.5"/><circle class="l1" cx="316" cy="356" r="5.5"/><circle class="l1" cx="316" cy="412" r="5.5"/>
    <circle class="l2" cx="356" cy="272" r="5.5"/><circle class="l2" cx="356" cy="300" r="5.5"/><circle class="l2" cx="356" cy="328" r="5.5"/><circle class="l2" cx="356" cy="356" r="5.5"/>
  </g>
  <circle class="l3" cx="440" cy="300" r="9" fill="#2518eb"/>

  <!-- the record goes in, the estimate comes out -->
  <path class="flow" d="M226 300H296"/>
  <path class="flow flow-2" d="M462 300H520"/>

  <!-- the number it lands on -->
  <text class="cap" x="548" y="238">PROBABILITY OF DEFAULT</text>
  <text class="out" x="548" y="316">1.8%</text>
  <text class="for" x="548" y="352">for this trade</text>
  <path d="M548 366h64" stroke="#cde94e" stroke-width="3"/>
</svg>
