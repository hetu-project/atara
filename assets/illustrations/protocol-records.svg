  <style>
    .cap{fill:#9aa0ad;font:500 12px/1 Inter,system-ui,sans-serif;letter-spacing:.14em}
    .lbl{fill:#8a8f9e;font:400 13px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
    .val{fill:#14161f;font:400 22px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
    .grid{stroke:#eef0f4;stroke-width:1}
    .axis{stroke:#d4d7de;stroke-width:1;stroke-linecap:round}
    .band{fill:url(#bandFade)}
    .mid{stroke:#16724d;stroke-width:2;fill:none;stroke-linecap:round}
    .tickmark{fill:#cde94e}.tickmark.bad{fill:#e58272}
    .pin{stroke:#c4c9d6;stroke-width:1;stroke-dasharray:3 4}
    .dot{fill:#fff;stroke:#16724d;stroke-width:2}
    .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 6s cubic-bezier(.5,0,.3,1) -4.2s infinite}
    @keyframes draw{0%,4%{stroke-dashoffset:1400}62%,100%{stroke-dashoffset:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.5,0,.3,1) -4.2s infinite}
    @keyframes grow{0%,4%{transform:scaleX(0)}62%,100%{transform:scaleX(1)}}
    .p1{animation:pop 6s ease-out -4.2s infinite}
    .p2{animation:pop 6s ease-out -3.3s infinite}
    .p3{animation:pop 6s ease-out -2.4s infinite}
    @keyframes pop{0%,8%{opacity:0}22%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.draw,.grow,.p1,.p2,.p3{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
  </style>
