    <g class="tickmark bad">
      <rect x="84" width="5" height="16" rx="2.5"/><rect x="240" width="5" height="16" rx="2.5"/><rect x="465" width="5" height="16" rx="2.5"/>
    </g>
  </g>
  <text class="cap" x="96" y="536">every completed settlement, one record</text>
</svg>
