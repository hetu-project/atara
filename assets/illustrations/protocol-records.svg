.5 369.5C487.4 369.4 482.3 369.3 477.2 369.2C472.2 369.1 467.1 369.0 462.0 368.9C456.9 368.8 451.8 368.7 446.8 368.6C441.7 368.5 436.6 368.4 431.5 368.3C426.4 368.2 421.3 368.1 416.2 368.0C411.2 367.9 406.1 367.7 401.0 367.6C395.9 367.5 390.8 367.3 385.8 367.2C380.7 367.0 375.6 366.9 370.5 366.7C365.4 366.6 360.3 366.4 355.2 366.2C350.2 366.1 345.1 365.9 340.0 365.7C334.9 365.5 329.8 365.3 324.8 365.1C319.7 364.9 314.6 364.7 309.5 364.4C304.4 364.2 299.3 364.0 294.2 363.7C289.2 363.5 284.1 363.2 279.0 363.0C273.9 362.7 268.8 362.4 263.8 362.1C258.7 361.8 253.6 361.5 248.5 361.2C243.4 360.9 238.3 360.6 233.2 360.2C228.2 359.9 223.1 359.5 218.0 359.1C212.9 358.7 207.8 358.4 202.8 357.9C197.7 357.5 192.6 357.1 187.5 356.6C182.4 356.2 177.3 355.7 172.2 355.2C167.2 354.7 162.1 354.2 157.0 353.7C151.9 353.1 146.8 352.6 141.8 352.0C136.7 351.4 131.6 350.8 126.5 350.2C121.4 349.5 116.3 348.9 111.2 348.2C106.2 347.5 98.5 346.4 96.0 346.0 Z"/></g>
  <path class="mid draw" d="M96.0 250.0C98.5 251.5 106.2 256.2 111.2 259.1C116.3 262.0 121.4 264.8 126.5 267.5C131.6 270.2 136.7 272.8 141.8 275.3C146.8 277.8 151.9 280.2 157.0 282.5C162.1 284.8 167.2 287.1 172.2 289.2C177.3 291.3 182.4 293.4 187.5 295.4C192.6 297.3 197.7 299.2 202.8 301.1C207.8 302.9 212.9 304.7 218.0 306.4C223.1 308.1 228.2 309.7 233.2 311.3C238.3 312.8 243.4 314.3 248.5 315.8C253.6 317.2 258.7 318.6 263.8 320.0C268.8 321.3 273.9 322.6 279.0 323.9C284.1 325.1 289.2 326.3 294.2 327.5C299.3 328.6 304.4 329.7 309.5 330.8C314.6 331.8 319.7 332.9 324.8 333.9C329.8 334.8 334.9 335.8 340.0 336.7C345.1 337.6 350.2 338.5 355.2 339.3C360.3 340.2 365.4 341.0 370.5 341.8C375.6 342.5 380.7 343.3 385.8 344.0C390.8 344.7 395.9 345.4 401.0 346.1C406.1 346.8 411.2 347.4 416.2 348.0C421.3 348.7 426.4 349.3 431.5 349.8C436.6 350.4 441.7 350.9 446.8 351.5C451.8 352.0 456.9 352.5 462.0 353.0C467.1 353.5 472.2 354.0 477.2 354.4C482.3 354.9 487.4 355.3 492.5 355.7C497.6 356.2 502.7 356.6 507.8 356.9C512.8 357.3 517.9 357.7 523.0 358.1C528.1 358.4 533.2 358.8 538.2 359.1C543.3 359.4 548.4 359.8 553.5 360.1C558.6 360.4 563.7 360.7 568.8 361.0C573.8 361.2 578.9 361.5 584.0 361.8C589.1 362.0 594.2 362.3 599.2 362.5C604.3 362.8 609.4 363.0 614.5 363.3C619.6 363.5 624.7 363.7 629.8 363.9C634.8 364.1 639.9 364.3 645.0 364.5C650.1 364.7 655.2 364.9 660.2 365.1C665.3 365.2 670.4 365.4 675.5 365.6C680.6 365.7 685.7 365.9 690.8 366.1C695.8 366.2 703.5 366.4 706.0 366.5"/>

  <!-- three read-offs as the record grows -->
  <g class="p1">
    <path class="pin" d="M96 250V440"/>
    <circle class="dot" cx="96" cy="250" r="8"/>
    <text class="val" x="96" y="228" text-anchor="start">34%</text>
    <text class="lbl" x="96" y="466">4 settlements</text>
  </g>
  <g class="p2">
    <path class="pin" d="M401 346V440"/>
    <circle class="dot" cx="401" cy="346" r="8"/>
    <text class="val" x="401" y="324" text-anchor="middle">13%</text>
    <text class="lbl" x="401" y="466" text-anchor="middle">80 settlements</text>
  </g>
  <g class="p3">
    <path class="pin" d="M706 366V440"/>
    <circle class="dot" cx="706" cy="366" r="8"/>
    <text class="val" x="706" y="344" text-anchor="end">8%</text>
    <text class="lbl" x="706" y="466" text-anchor="end">1,600 settlements</text>
  </g>

  <path class="axis" d="M96 440H706"/>

  <!-- the records themselves, thickening under the axis -->
  <g transform="translate(96 492)">
    <g class="tickmark">
      <rect width="5" height="16" rx="2.5"/><rect x="26" width="5" height="16" rx="2.5"/><rect x="58" width="5" height="16" rx="2.5"/>
